<!-- 글꼴은 화면 그리기를 막지 않도록 비동기로 불러온다(처음 잠깐은 기본 글꼴, 로딩창이 덮고 있다) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Cinzel:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'">
<!-- 파일 버전(V): 사이트를 고칠 때마다 아래 V 값 하나만 바꾸면 CSS와 모든 JS가 한꺼번에 새 주소로 바뀐다.
     JS 파일은 서로 불러 쓰기 때문에, 업데이트 직후 일부만 옛 파일이 남으면(브라우저 캐시 10분) 화면이 안 뜰 수 있다.
     모든 JS 주소에 같은 V를 붙여(import map) 같은 버전끼리만 쓰이게 한다. 새 JS 파일을 만들면 JS 목록에도 추가한다.
     import map을 모르는 아주 오래된 브라우저는 예전처럼 버전 없이 받는다. -->
<script>
(function () {
  var V = '20261119t';
  var JS = ['app', 'core', 'stats', 'store', 'config', 'social', 'season', 'today', 'board', 'dice', 'talk', 'players', 'hook', 'gacha', 'me', 'admin', 'auction', 'replay', 'maker', 'live', 'xmas', 'newyear'];
  var ok = !!(window.HTMLScriptElement && HTMLScriptElement.supports && HTMLScriptElement.supports('importmap'));
  var q = ok ? '?v=' + V : '', map = {};
  JS.forEach(function (n) { map['./js/' + n + '.js'] = './js/' + n + '.js' + q; });
  // 처음 화면에 필요한 모듈은 한꺼번에 미리 받는다(연쇄 다운로드 지연 방지). 시즌 장식 코드는 시즌에만
  var d = new Date(), md = (d.getMonth() + 1) * 100 + d.getDate(), pre = JS.slice(0, 14);
  if (md >= 1116 && md <= 1226) pre.push('xmas'); else if (md <= 115) pre.push('newyear');
  document.write((ok ? '<script type="importmap">' + JSON.stringify({ imports: map }) + '<\/script>' : '')
    + pre.map(function (n) { return '<link rel="modulepreload" href="js/' + n + '.js' + q + '">'; }).join('')
    + '<link rel="stylesheet" href="css/style.css?v=' + V + '">');
  // 그래도 파일이 섞여 시작이 안 되면 한 번만: 이 사이트 파일을 서버에서 새로 받아 캐시를 바꾼 뒤 다시 연다(js/core.js의 lazyPage도 씀)
  var files = JS.map(function (n) { return 'js/' + n + '.js' + q; }).concat('css/style.css?v=' + V, location.href);
  window.NP_HEAL = function () {
    try { if (sessionStorage.getItem('np:heal')) return false; sessionStorage.setItem('np:heal', '1'); } catch (e) { return false; }
    Promise.all(files.map(function (u) { return fetch(u, { cache: 'reload' }).catch(function () {}); })).then(function () { location.reload(); });
    return true;
  };
})();
</script>
</head>
<body>
<div id="splash"></div>
<script>
// 첫 화면부터 로딩창을 바로 덮는다(모듈·DB 연결을 기다리는 동안 홈 화면이 잠깐 보이는 문제 방지).
(function () { try {
  var n = localStorage.getItem('naejeon:nick'), qs = location.search;
  if ((sessionStorage.getItem('naejeon:welcomed') && n) || !(/[?&](k|demo)\b/.test(qs))) return;
  var e = document.getElementById('splash'), d = new Date(), m = d.getMonth() + 1, md = m * 100 + d.getDate();
  e.className = 'on boot' + (md >= 1116 && md <= 1226 && localStorage.getItem('naejeon:xmas') !== '0' ? ' xs' : m === 1 && d.getDate() <= 15 && localStorage.getItem('naejeon:newyear') !== '0' ? ' ny' : '');
  e.innerHTML = '<div class="sp-boot"><b>NAEJEON<i>POT</i></b><span></span></div>';
} catch (x) {} })();
</script>

<script type="module">import './js/app.js';</script>
<script>
// 시작 확인: js/app.js가 실행되면 NP_OK가 켜진다. 15초가 지나도 안 켜지면(스크립트 오류) 위의 NP_HEAL로 한 번 복구
setTimeout(function () { if (!window.NP_OK && window.NP_HEAL) window.NP_HEAL(); }, 15000);
addEventListener('error', function (e) { if (!window.NP_OK && window.NP_HEAL && /export|import|module/i.test(e.message || '')) window.NP_HEAL(); });
</script>
